name: Update news feed

on:
  schedule:
    # Every 2 hours (GitHub cron runs in UTC and may start a few minutes late)
    - cron: "0 */2 * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and combine feeds
        run: python fetch_feeds.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update news feed"
            git push
          fi
